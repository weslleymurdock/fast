services:
  mariadb:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - voip-db
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  freepbx:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        ASTERISK_VERSION: "22.10.1"
        FREEPBX_REF: "release/17.0"
    image: ghcr.io/weslleymurdock/fast:freepbx17-asterisk22
    network_mode: host
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-asterisk}
      DB_CDR_NAME: ${DB_CDR_NAME:-asteriskcdrdb}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      RTP_START: ${RTP_START:-10000}
      RTP_END: ${RTP_END:-20000}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - asterisk_etc:/etc/asterisk
      - asterisk_lib:/var/lib/asterisk
      - asterisk_spool:/var/spool/asterisk
      - asterisk_logs:/var/log/asterisk
      - freepbx_www:/var/www/html

volumes:
  mariadb_data:
  asterisk_etc:
  asterisk_lib:
  asterisk_spool:
  asterisk_logs:
  freepbx_www:

networks:
  voip-db:
