services:
  mariadb:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: ${DB_NAME:-asterisk}
      MARIADB_USER: ${DB_USER:?DB_USER is required}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:3036:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"$${MARIADB_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  freepbx:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        ASTERISK_VERSION: "22.10.1"
        FREEPBX_REF: "release/17.0"
    image: ghcr.io/weslleymurdock/fast:f17ast22
    network_mode: host
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_CDR_NAME: ${DB_CDR_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      RTP_START: ${RTP_START:-10000}
      RTP_END: ${RTP_END:-20000}
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - asterisk_etc:/etc/asterisk
      - asterisk_lib:/var/lib/asterisk
      - asterisk_spool:/var/spool/asterisk
      - asterisk_logs:/var/log/asterisk
      - freepbx_www:/var/www/html
      - pbx_logs:/var/log/pbx

volumes:
  mariadb_data:
    driver: local
  asterisk_etc:
    driver: local
  asterisk_lib:
    driver: local
  asterisk_spool:
    driver: local
  asterisk_logs:
    driver: local
  freepbx_www:
    driver: local
  pbx_logs: 
    driver: local
    